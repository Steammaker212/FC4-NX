# Far Cry 4 for the Switch: your options. Every other setting is built into the NRO
# (app/katamari_switch_defaults.toml). Delete this file and the game writes it again at the next start.

# Clocks held through sys-clk while the game runs (released when it exits; nothing happens without sys-clk).
# CPU: 1785 (the boost clock games use while loading), 1020 (stock), 0 = leave it to the system.
# GPU: 768 (the docked clock), 460 (stock handheld), 0 = leave it to the system.
# The stock handheld clocks hold the gameplay near 15 fps; these bring it toward 30, using more battery.
fc4_clock_cpu_mhz = 1785
fc4_clock_gpu_mhz = 768

# The 3D image's height, handheld and docked: 720, or 540 for less GPU work (scaled up to the screen).
banjo_renut_render_height_handheld = 540
banjo_renut_render_height_docked = 648

# Frame rate counter in the top left corner.
banjo_show_fps = false

# Samples per pixel of the game's edge smoothing (MSAA): 4 (the game's own), 2 or 1 (off).
# Fewer gives rougher edges and less GPU work.
msaa_level = 2

# Frame rate cap: "Off" (the game's own pacing) or "30".
frame_cap = "Off"

# Language (the Xbox 360's numbers): 1 = English, 4 = French, 5 = Spanish, 9 = Portuguese (this disc's four).
user_language = 1

# Face buttons by position, as on an Xbox pad (bottom = A). false = by letter.
input_xbox_layout = true

# Button mapping: the Switch buttons that press each Xbox button. Empty = default.
# Buttons: A B X Y L R ZL ZR PLUS MINUS LSTICK RSTICK UP DOWN LEFT RIGHT SL SR NONE. Example: a = "B, ZR"

[input_p1]
a = ""
b = ""
x = ""
y = ""
lb = ""
rb = ""
lt = ""
rt = ""
start = ""
back = ""
ls = ""
rs = ""
up = ""
down = ""
left = ""
right = ""
